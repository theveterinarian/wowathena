<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-label="Lady Justice holding the scales">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ba98a"/>
      <stop offset="60%" stop-color="#4a7c59"/>
      <stop offset="100%" stop-color="#2d5a3d"/>
    </linearGradient>
  </defs>
  <g fill="url(#vg)">
    <!-- head -->
    <circle cx="150" cy="70" r="26"/>
    <!-- blindfold -->
    <rect x="124" y="60" width="52" height="12" rx="6" fill="#f4c842" opacity=".85"/>
    <!-- body / robe -->
