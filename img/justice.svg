    <path d="M150 130 L86 178 l-10 -12 62 -50z"/>
    <rect x="60" y="176" width="10" height="120" rx="4"/>
  </g>
  <g stroke="#2d5a3d" stroke-width="4" fill="none">
    <line x1="236" y1="74" x2="236" y2="34"/>
    <line x1="186" y1="40" x2="286" y2="40"/>
    <line x1="196" y1="40" x2="196" y2="66"/>
    <line x1="276" y1="40" x2="276" y2="66"/>
  </g>
  <g fill="#4a7c59">
    <path d="M176 66h40l-20 22z"/>
    <path d="M256 66h40l-20 22z"/>
  </g>
  <ellipse cx="150" cy="292" rx="86" ry="10" fill="#2d5a3d" opacity=".35"/>
</svg>
