<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-label="Lady Justice, blindfolded, holding the scales of justice and a sword">
  <defs>
    <linearGradient id="robe" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#8fbb9d"/>
      <stop offset="45%" stop-color="#5b8f6b"/>
      <stop offset="100%" stop-color="#2d5a3d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#9cc4a8"/>
      <stop offset="100%" stop-color="#4a7c59"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a7c59"/>
      <stop offset="100%" stop-color="#26492f"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="378" rx="96" ry="12" fill="#2d5a3d" opacity=".25"/>

  <!-- scales -->
  <g stroke="#3d6b4c" stroke-width="3.4" stroke-linecap="round" fill="none">
    <line x1="236" y1="74" x2="236" y2="28"/>
    <line x1="190" y1="32" x2="282" y2="32"/>
    <line x1="198" y1="32" x2="198" y2="54"/>
    <line x1="274" y1="32" x2="274" y2="54"/>
  </g>
  <circle cx="236" cy="26" r="4.5" fill="#f4c842"/>
  <path d="M180 54h36q-3 15-18 15t-18-15z" fill="#7ba98a"/>
  <path d="M256 54h36q-3 15-18 15t-18-15z" fill="#7ba98a"/>

  <!-- sword at her side, point down -->
  <g fill="url(#dark)">
    <rect x="66" y="196" width="8" height="30" rx="4"/>
    <circle cx="70" cy="194" r="5.5"/>
    <rect x="52" y="220" width="36" height="7" rx="3.5"/>
    <path d="M64 232h13v96l-6.5 14-6.5-14z"/>
  </g>

  <!-- robe -->
  <path d="M150 118c-22 0-36 14-40 36l-14 96c-6 42-16 76-26 96-2 5 1 8 6 8h148c5 0 8-3 6-8-10-20-20-54-26-96l-14-96c-4-22-18-36-40-36z" fill="url(#robe)"/>
  <g stroke="#2d5a3d" stroke-width="2" opacity=".25" fill="none" stroke-linecap="round">
    <path d="M126 160c-4 60-12 138-26 190"/>
    <path d="M150 162v188"/>
    <path d="M174 160c4 60 12 138 26 190"/>
  </g>
  <path d="M112 186c25 13 51 13 76 0l3 17c-27 13-55 13-82 0z" fill="#f4c842" opacity=".5"/>

  <!-- plinth -->
  <path d="M74 354h152l10 22H64z" fill="url(#dark)"/>

  <!-- arms -->
  <path d="M172 124l58-54 12 14-58 54z" fill="url(#skin)"/>
  <circle cx="236" cy="76" r="9.5" fill="url(#skin)"/>
  <path d="M128 126l-42 90-14-7 42-92z" fill="url(#skin)"/>
  <circle cx="78" cy="222" r="9.5" fill="url(#skin)"/>

  <!-- neck and head -->
  <rect x="141" y="102" width="18" height="24" fill="#54866a"/>
  <circle cx="150" cy="82" r="25" fill="url(#skin)"/>
  <path d="M150 57c-14 0-25 11-25 25 0 3 0 6 1 8 2-22 12-24 24-24s22 2 24 24c1-2 1-5 1-8 0-14-11-25-25-25z" fill="#3d6b4c"/>
  <rect x="124" y="76" width="52" height="13" rx="2" fill="#f4c842"/>
  <path d="M176 78l12 4-2 9-10-3z" fill="#d4a017"/>
</svg>
